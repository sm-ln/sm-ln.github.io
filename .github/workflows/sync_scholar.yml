
name: Sync Google Scholar Publications

on:
  schedule:
    - cron: '0 0 * * 0' # 设定为每周日午夜自动运行一次
  workflow_dispatch:    # 允许你在 GitHub Actions 页面手动点击运行

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install scholarly
        run: pip install scholarly

      - name: Run Scholar fetch script
        run: python update_bib.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _bibliography/papers.bib
          git commit -m "chore: auto-update publications from Google Scholar" || exit 0
          git push
